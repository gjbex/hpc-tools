[metadata]
name = hpc-tools
version = 0.1.0
description = Small profile-based helpers for interacting with remote HPC systems.
long_description = file: README.md
long_description_content_type = text/markdown
author = Geert Jan Bex

[options]
packages = find:
python_requires = >=3.10
install_requires =
    packaging>=24
    PyYAML>=6
    tomli>=2.0; python_version < "3.11"
    tomlkit>=0.12

[options.extras_require]
mcp =
    mcp>=1.27,<2

[options.package_data]
hpc_tools.data =
    *.slurm
    cuda/*
    containers/*/*

[options.entry_points]
console_scripts =
    hpc = hpc_tools.cli:main
    hpc-mcp = hpc_tools.mcp_server:main
    hpc-mcp-bridge = hpc_tools.mcp_bridge:main
    hpc-mcp-relay = hpc_tools.mcp_bridge:relay_main
    hpc-agent-launch = hpc_tools.restricted_launch:main
hpc_tools.plugins =
    benchmark = hpc_tools.plugins.benchmark_support:get_plugin
    cxx = hpc_tools.plugins.cxx_support:get_plugin
    python = hpc_tools.plugins.python_support:get_plugin
    r = hpc_tools.plugins.r_support:get_plugin
