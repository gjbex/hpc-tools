[metadata]
name = hpc-tools
version = 0.1.0
description = Small profile-based helpers for interacting with remote HPC systems.
long_description = file: README.md
long_description_content_type = text/markdown
author = Geert Jan Bex

[options]
packages = find:
python_requires = >=3.10

[options.entry_points]
console_scripts =
    hpc = hpc_tools.cli:main
