name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Codex plugin manifest
        run: python3 tools/validate_plugin.py .

      - name: Validate Codex skills
        run: python3 tools/validate_skills.py .

      - name: Check repository hygiene
        run: python3 tools/check_repo_hygiene.py .

      - name: Install package dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Install release acceptance tools
        run: python3 -m pip install build pipx

      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Compile Python modules
        run: python3 -m py_compile hpc_tools/*.py hpc_tools/plugins/*.py hpc_tools/plugins/cxx/*.py hpc_tools/plugins/python/*.py hpc_tools/plugins/r/*.py hpc_tools/commands/*.py hpc_tools/mcp/*.py tests/*.py tools/*.py

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Run capability acceptance tier
        run: python3 tools/run_capability_acceptance.py

      - name: Build wheel and source archive
        run: python3 -m build --outdir dist

      - name: Validate isolated wheel and source installations
        run: |
          python3 tools/check_capability_distribution.py \
            --wheel dist/*.whl \
            --sdist dist/*.tar.gz
