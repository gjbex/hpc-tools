name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Validate Codex plugin manifest
        run: uv run --no-project --python 3.13 python tools/validate_plugin.py .

      - name: Validate Codex skills
        run: uv run --no-project --python 3.13 python tools/validate_skills.py .

      - name: Check repository hygiene
        run: uv run --no-project --python 3.13 python tools/check_repo_hygiene.py .

      - name: Install the locked environment
        run: uv sync --locked --all-extras --all-groups

      - name: Build documentation
        run: uv run --locked --no-sync mkdocs build --strict

      - name: Compile Python modules
        run: uv run --locked --no-sync python -m py_compile hpc_tools/*.py hpc_tools/plugins/*.py hpc_tools/plugins/cxx/*.py hpc_tools/plugins/python/*.py hpc_tools/plugins/r/*.py hpc_tools/commands/*.py hpc_tools/mcp/*.py tests/*.py tools/*.py

      - name: Run tests
        run: uv run --locked --no-sync python -m unittest discover -s tests

      - name: Run capability acceptance tier
        run: uv run --locked --no-sync python tools/run_capability_acceptance.py

      - name: Run delegated credit-budget acceptance tier
        run: uv run --locked --no-sync python tools/run_credit_budget_acceptance.py

      - name: Build wheel and source archive
        run: uv build --out-dir dist

      - name: Validate isolated wheel and source installations
        run: |
          uv run --locked --no-sync python tools/check_capability_distribution.py \
            --wheel dist/*.whl \
            --sdist dist/*.tar.gz
