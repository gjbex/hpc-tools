site_name: hpc-tools
site_description: Profile-based tools for safe SSH and Slurm workflows on HPC systems
site_url: https://gjbex.github.io/hpc-tools/
repo_url: https://github.com/gjbex/hpc-tools
repo_name: gjbex/hpc-tools
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs
  collapse_navigation: true
  sticky_navigation: true
  navigation_depth: 3

plugins:
  - search

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Welcome:
      - Overview: index.md
      - Choose an interface: interfaces.md
  - Quick start: getting-started.md
  - Installation and maintenance: installation.md
  - Core concepts and safety: core-concepts.md
  - Configure cluster profiles: configuration.md
  - Onboard a new cluster: onboarding.md
  - Everyday cluster operations: everyday-operations.md
  - Run Slurm jobs: slurm-jobs.md
  - Track work from submission to analysis: submissions.md
  - Software environments and dependencies: software-environments.md
  - Deploy and build software remotely: remote-builds.md
  - Probes and cluster discovery: probes.md
  - Job arrays and parameter sweeps: job-arrays.md
  - Benchmarking on Slurm: benchmarking.md
  - Container workflows: containers.md
  - Cluster references and sharing: reference-sets.md
  - Extending hpc-tools:
      - CLI plugin system: plugins.md
  - Contributing:
      - Build the documentation: contributing/documentation.md
