site_name: hpc-tools
site_description: Profile-based tools for safe SSH and Slurm workflows on HPC systems
site_url: https://gjbex.github.io/hpc-tools/
repo_url: https://github.com/gjbex/hpc-tools
repo_name: gjbex/hpc-tools
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs
  collapse_navigation: true
  sticky_navigation: true
  navigation_depth: 3

plugins:
  - search

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Welcome:
      - Overview: index.md
      - Choose an interface: interfaces.md
  - Quick start: getting-started.md
  - Installation and maintenance: installation.md
  - Core concepts and safety: core-concepts.md
  - Capability policy: capabilities.md
  - Configure cluster profiles: configuration.md
  - Onboard a new cluster: onboarding.md
  - Everyday cluster operations: everyday-operations.md
  - Run Slurm jobs: slurm-jobs.md
  - Track work from submission to analysis: submissions.md
  - Software environments and dependencies: software-environments.md
  - Deploy and build software remotely: remote-builds.md
  - Probes and cluster discovery: probes.md
  - Job arrays and parameter sweeps: job-arrays.md
  - Benchmarking on Slurm: benchmarking.md
  - Container workflows: containers.md
  - Cluster references and sharing: reference-sets.md
  - Agent integrations:
      - Using hpc-tools with Codex: codex.md
      - MCP integration: mcp.md
      - Restricted unattended agent: restricted-agent.md
  - End-to-end recipes: recipes.md
  - Troubleshooting: troubleshooting.md
  - Reference: reference.md
  - Limitations, support, and project information: project-information.md
  - Extending hpc-tools:
      - CLI plugin system: plugins.md
  - Contributing:
      - Build the documentation: contributing/documentation.md
      - Capability design and implementation: development/capabilities/index.md
      - Delegated MCP credit-budget plan: development/delegated-credit-budget-plan.md
      - Restricted-agent production plan: development/restricted-agent-production-plan.md
      - MCP server roadmap: development/mcp-roadmap.md
      - Real-cluster qualification: development/real-cluster-qualification.md
      - Delegation security internals: delegation-development.md
      - Parent-agent lifecycle design: parent-agent-lifecycle.md
